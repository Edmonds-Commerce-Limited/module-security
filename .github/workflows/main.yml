name: CI

on:
  push:
    branches: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # magento/framework declares all of these as hard requirements
          extensions: bcmath, curl, dom, ftp, gd, hash, iconv, intl, mbstring, openssl, simplexml, sodium, xsl, zip
          ini-values: memory_limit=-1
          coverage: none
          tools: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # composer.lock is not committed, so each leg resolves independently and PHP 8.2 ends up on a
      # different magento/framework than 8.4. Print it so that difference is visible, not silent.
      - name: Show resolved Magento version
        run: composer show magento/framework | head -n 3

      - name: Coding standard
        run: vendor/bin/phpcs

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=-1

      # Fails when any rule in rector.php still has something to change
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Unit tests
        run: vendor/bin/phpunit
