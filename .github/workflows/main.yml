name: CI

on:
  push:
    branches: ['*']
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # magento/framework declares all of these as hard requirements
          extensions: bcmath, dom, gd, intl, mbstring, simplexml, soap, sockets, xsl, zip
          coverage: none
          tools: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run QA suite
        run: ./bin/qa.bash
